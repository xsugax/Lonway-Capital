<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#060913"/><stop offset="100%" stop-color="#0d1628"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C4A052"/><stop offset="100%" stop-color="#D4B76A"/></linearGradient>
    <linearGradient id="greenLine" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#10B981" stop-opacity="0"/><stop offset="100%" stop-color="#10B981"/></linearGradient>
    <linearGradient id="goldLine" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#C4A052" stop-opacity="0"/><stop offset="100%" stop-color="#C4A052"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.05" stroke="#C4A052">
    <line x1="100" y1="120" x2="100" y2="500" stroke-width="0.5"/>
    <line x1="300" y1="120" x2="300" y2="500" stroke-width="0.5"/>
    <line x1="500" y1="120" x2="500" y2="500" stroke-width="0.5"/>
    <line x1="700" y1="120" x2="700" y2="500" stroke-width="0.5"/>
    <line x1="900" y1="120" x2="900" y2="500" stroke-width="0.5"/>
    <line x1="1100" y1="120" x2="1100" y2="500" stroke-width="0.5"/>
    <line x1="60" y1="200" x2="1160" y2="200" stroke-width="0.5"/>
    <line x1="60" y1="280" x2="1160" y2="280" stroke-width="0.5"/>
    <line x1="60" y1="360" x2="1160" y2="360" stroke-width="0.5"/>
    <line x1="60" y1="440" x2="1160" y2="440" stroke-width="0.5"/>
  </g>
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#C4A052" letter-spacing="4">LONDWAY CAPITAL</text>
  <text x="600" y="85" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="30" font-weight="bold" fill="#fff">Wealth Management &amp; Portfolio Analytics</text>
  <rect x="500" y="98" width="200" height="3" rx="1.5" fill="url(#gold)" opacity="0.5"/>
  <!-- Main portfolio chart area -->
  <!-- Y-axis labels -->
  <text x="50" y="205" text-anchor="end" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">$5M</text>
  <text x="50" y="285" text-anchor="end" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">$3.5M</text>
  <text x="50" y="365" text-anchor="end" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">$2M</text>
  <text x="50" y="445" text-anchor="end" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">$500K</text>
  <!-- X-axis labels -->
  <text x="100" y="520" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">2019</text>
  <text x="300" y="520" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">2020</text>
  <text x="500" y="520" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">2021</text>
  <text x="700" y="520" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">2022</text>
  <text x="900" y="520" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">2023</text>
  <text x="1100" y="520" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">2024</text>
  <!-- Portfolio value line (green, growing) -->
  <polyline fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    points="100,430 180,420 260,410 300,425 340,395 420,370 480,350 500,330 560,300 620,310 680,280 700,295 740,265 800,240 860,220 900,235 940,210 1000,195 1060,175 1100,160"/>
  <!-- Fill area under green line -->
  <polygon fill="#10B981" opacity="0.06"
    points="100,430 180,420 260,410 300,425 340,395 420,370 480,350 500,330 560,300 620,310 680,280 700,295 740,265 800,240 860,220 900,235 940,210 1000,195 1060,175 1100,160 1100,500 100,500"/>
  <!-- Benchmark line (gold, moderate growth) -->
  <polyline fill="none" stroke="#C4A052" stroke-width="2" stroke-dasharray="6,3" stroke-linecap="round"
    points="100,430 180,425 260,418 300,430 340,410 420,400 480,390 500,380 560,375 620,385 680,370 700,380 740,365 800,355 860,345 900,355 940,340 1000,330 1060,320 1100,310"/>
  <!-- Current value tooltip -->
  <g transform="translate(1070,130)">
    <rect x="-80" y="0" width="160" height="50" rx="8" fill="rgba(16,185,129,0.1)" stroke="#10B981" stroke-width="1"/>
    <text x="0" y="22" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="11" fill="#10B981" font-weight="bold">PORTFOLIO VALUE</text>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="18" fill="#fff" font-weight="bold">$4,847,392</text>
  </g>
  <!-- Performance badge -->
  <g transform="translate(1070,192)">
    <rect x="-80" y="0" width="160" height="38" rx="8" fill="rgba(196,160,82,0.08)" stroke="#C4A052" stroke-width="0.5"/>
    <text x="0" y="16" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="10" fill="#C4A052">ANNUAL RETURN</text>
    <text x="0" y="32" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="16" fill="#10B981" font-weight="bold">+18.7%</text>
  </g>
  <!-- Legend -->
  <g transform="translate(80,130)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#10B981" stroke-width="3"/>
    <text x="40" y="4" font-family="Helvetica,sans-serif" font-size="12" fill="#9CA3AF">LC Managed Portfolio</text>
    <line x1="200" y1="0" x2="230" y2="0" stroke="#C4A052" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="240" y="4" font-family="Helvetica,sans-serif" font-size="12" fill="#9CA3AF">S&amp;P 500 Benchmark</text>
  </g>
  <!-- Bottom: Asset allocation -->
  <rect x="0" y="540" width="1200" height="90" fill="rgba(196,160,82,0.02)"/>
  <rect x="0" y="540" width="1200" height="1" fill="#C4A052" opacity="0.1"/>
  <text x="80" y="570" font-family="Helvetica,sans-serif" font-size="12" fill="#C4A052" font-weight="bold" letter-spacing="2">ASSET ALLOCATION</text>
  <!-- Allocation bars -->
  <g transform="translate(80,580)">
    <rect width="240" height="20" rx="4" fill="#10B981" opacity="0.8"/>
    <text x="120" y="14" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="10" fill="#fff" font-weight="bold">Equities 40%</text>
  </g>
  <g transform="translate(330,580)">
    <rect width="180" height="20" rx="4" fill="#C4A052" opacity="0.8"/>
    <text x="90" y="14" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="10" fill="#060913" font-weight="bold">Fixed Income 30%</text>
  </g>
  <g transform="translate(520,580)">
    <rect width="120" height="20" rx="4" fill="#3B82F6" opacity="0.7"/>
    <text x="60" y="14" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="10" fill="#fff" font-weight="bold">Real Estate 15%</text>
  </g>
  <g transform="translate(650,580)">
    <rect width="60" height="20" rx="4" fill="#8B5CF6" opacity="0.7"/>
    <text x="30" y="14" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="10" fill="#fff" font-weight="bold">Alt 8%</text>
  </g>
  <g transform="translate(720,580)">
    <rect width="42" height="20" rx="4" fill="#6B7280" opacity="0.6"/>
    <text x="21" y="14" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="10" fill="#fff" font-weight="bold">Cash 7%</text>
  </g>
  <!-- Dot markers on green line -->
  <circle cx="500" cy="330" r="4" fill="#10B981" stroke="#060913" stroke-width="2"/>
  <circle cx="700" cy="295" r="4" fill="#10B981" stroke="#060913" stroke-width="2"/>
  <circle cx="900" cy="235" r="4" fill="#10B981" stroke="#060913" stroke-width="2"/>
  <circle cx="1100" cy="160" r="4" fill="#10B981" stroke="#060913" stroke-width="2"/>
</svg>
    <text x="110" y="52" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#9CA3AF">Avg. Transfer Speed</text>
    <text x="110" y="70" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="10" fill="#6B7280">Swift &amp; instant settlement</text>

    <circle cx="280" cy="225" r="2"/><circle cx="260" cy="240" r="2"/><circle cx="245" cy="215" r="2"/>
    <circle cx="270" cy="235" r="2"/><circle cx="235" cy="225" r="2"/><circle cx="255" cy="200" r="2"/>

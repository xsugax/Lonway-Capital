    <line x1="36" y1="80" x2="80" y2="80" stroke="#0d1628" stroke-width="0.5" opacity="0.5"/>
    <line x1="36" y1="90" x2="80" y2="90" stroke="#0d1628" stroke-width="0.5" opacity="0.5"/>
    <line x1="58" y1="70" x2="58" y2="104" stroke="#0d1628" stroke-width="0.5" opacity="0.5"/>

      <path d="M4,12 Q10,6 10,0" fill="none" stroke="#C4A052" stroke-width="1.5" opacity="0.5"/>
      <path d="M8,16 Q16,8 16,0" fill="none" stroke="#C4A052" stroke-width="1.5" opacity="0.5"/>
    </g>
    <!-- Card number -->
    <text x="36" y="140" font-family="'Courier New',monospace" font-size="20" fill="#fff" letter-spacing="3" opacity="0.85">4892 •••• •••• 7341</text>

    <line x1="38" y1="86" x2="84" y2="86" stroke="#0a0a0a" stroke-width="0.5" opacity="0.4"/>
    <line x1="38" y1="96" x2="84" y2="96" stroke="#0a0a0a" stroke-width="0.5" opacity="0.4"/>
    <line x1="61" y1="74" x2="61" y2="110" stroke="#0a0a0a" stroke-width="0.5" opacity="0.4"/>

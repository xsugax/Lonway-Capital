  <!-- Card tier labels -->
  <g transform="translate(0,490)">
    <text x="200" y="30" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#fff">Standard</text>
    <text x="200" y="52" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#6B7280">No annual fee</text>
    <text x="200" y="72" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#6B7280">1.5% cashback</text>
    <text x="600" y="30" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#C4A052">Gold Elite</text>
    <text x="600" y="52" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#6B7280">Priority support</text>
    <text x="600" y="72" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#6B7280">3% cashback · Airport lounge</text>
    <text x="1000" y="30" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#C4A052">Black World Elite</text>
    <text x="1000" y="52" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#6B7280">Dedicated relationship manager</text>
    <text x="1000" y="72" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#6B7280">5% cashback · Unlimited lounge · Concierge</text>
  </g>

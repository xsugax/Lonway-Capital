<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#060913"/><stop offset="100%" stop-color="#0d1628"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C4A052"/><stop offset="100%" stop-color="#D4B76A"/></linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a1a2e"/><stop offset="40%" stop-color="#0d1628"/><stop offset="100%" stop-color="#16213e"/></linearGradient>
    <linearGradient id="goldCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#C4A052"/><stop offset="50%" stop-color="#D4B76A"/><stop offset="100%" stop-color="#A8873E"/></linearGradient>
    <linearGradient id="blackCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a1a1a"/><stop offset="100%" stop-color="#0a0a0a"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle radial glow -->
  <circle cx="600" cy="315" r="400" fill="#C4A052" opacity="0.02"/>
  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#C4A052" letter-spacing="4">LONDWAY CAPITAL</text>
  <text x="600" y="110" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="32" font-weight="bold" fill="#fff">Premium Card Collection</text>
  <rect x="540" y="124" width="120" height="3" rx="1.5" fill="url(#gold)" opacity="0.6"/>
  <!-- Card 1: Standard (left) -->
  <g transform="translate(60,170) rotate(-8,200,130)">
    <rect width="380" height="240" rx="16" fill="url(#cardFace)" stroke="rgba(196,160,82,0.15)" stroke-width="1"/>
    <rect x="0" y="0" width="380" height="240" rx="16" fill="url(#cardFace)" opacity="0.8"/>
    <!-- Card chip -->

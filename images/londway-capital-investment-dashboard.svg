    <g stroke="#C4A052" stroke-width="0.3" opacity="0.1">
      <line x1="30" y1="80" x2="480" y2="80"/>
      <line x1="30" y1="120" x2="480" y2="120"/>
      <line x1="30" y1="160" x2="480" y2="160"/>
    </g>
  </g>
  <!-- Holdings list -->
  <g transform="translate(815,300)">
    <rect width="240" height="240" rx="8" fill="rgba(196,160,82,0.02)" stroke="rgba(196,160,82,0.08)" stroke-width="1"/>
    <text x="18" y="28" font-family="Helvetica,sans-serif" font-size="13" fill="#fff" font-weight="bold">Top Holdings</text>
    <!-- Holdings -->
    <g font-family="Helvetica,sans-serif" font-size="12" transform="translate(18,50)">
      <text x="0" y="0" fill="#fff">AAPL</text><text x="120" y="0" fill="#10B981" text-anchor="end">+2.4%</text><text x="200" y="0" fill="#6B7280" text-anchor="end">$482K</text>
      <text x="0" y="30" fill="#fff">MSFT</text><text x="120" y="30" fill="#10B981" text-anchor="end">+1.8%</text><text x="200" y="30" fill="#6B7280" text-anchor="end">$421K</text>
      <text x="0" y="60" fill="#fff">BRK.B</text><text x="120" y="60" fill="#10B981" text-anchor="end">+0.9%</text><text x="200" y="60" fill="#6B7280" text-anchor="end">$380K</text>
      <text x="0" y="90" fill="#fff">JNJ</text><text x="120" y="90" fill="#EF4444" text-anchor="end">-0.3%</text><text x="200" y="90" fill="#6B7280" text-anchor="end">$295K</text>
      <text x="0" y="120" fill="#fff">V</text><text x="120" y="120" fill="#10B981" text-anchor="end">+1.2%</text><text x="200" y="120" fill="#6B7280" text-anchor="end">$268K</text>
      <text x="0" y="150" fill="#fff">JPM</text><text x="120" y="150" fill="#10B981" text-anchor="end">+0.6%</text><text x="200" y="150" fill="#6B7280" text-anchor="end">$245K</text>
    </g>
  </g>
</svg>
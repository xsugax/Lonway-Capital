<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#060913"/><stop offset="100%" stop-color="#0d1628"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C4A052"/><stop offset="100%" stop-color="#D4B76A"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle radial glow -->
  <circle cx="600" cy="315" r="350" fill="#C4A052" opacity="0.015"/>
  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#C4A052" letter-spacing="4">LONDWAY CAPITAL</text>
  <text x="600" y="90" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="30" font-weight="bold" fill="#fff">Investment Dashboard</text>
  <rect x="520" y="103" width="160" height="3" rx="1.5" fill="url(#gold)" opacity="0.5"/>
  <!-- Dashboard mockup -->
  <!-- Dashboard frame -->
  <rect x="80" y="130" width="1040" height="460" rx="12" fill="#0a0e1a" stroke="rgba(196,160,82,0.15)" stroke-width="1"/>
  <!-- Top bar -->
  <rect x="80" y="130" width="1040" height="50" rx="12" fill="#111827"/>
  <rect x="80" y="168" width="1040" height="12" fill="#111827"/>
  <!-- Nav dots -->
  <circle cx="108" cy="155" r="5" fill="#EF4444" opacity="0.7"/>
  <circle cx="128" cy="155" r="5" fill="#F59E0B" opacity="0.7"/>
  <circle cx="148" cy="155" r="5" fill="#10B981" opacity="0.7"/>
  <!-- Nav text -->
  <text x="600" y="160" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="13" fill="#9CA3AF">app.londwaycapital.com/investments</text>
  <!-- Side nav -->
  <rect x="80" y="180" width="200" height="410" fill="#0d1117" rx="0"/>
  <!-- Nav items -->
  <g font-family="Helvetica,sans-serif" font-size="12" fill="#6B7280">
    <rect x="95" y="200" width="170" height="34" rx="6" fill="rgba(196,160,82,0.08)"/>
    <text x="125" y="222" fill="#C4A052" font-weight="bold">◆ Dashboard</text>
    <text x="125" y="260">📊 Portfolio</text>
    <text x="125" y="290">💹 Markets</text>
    <text x="125" y="320">🏦 Accounts</text>
    <text x="125" y="350">📈 Analytics</text>
    <text x="125" y="380">⚙ Settings</text>
  </g>
  <!-- User avatar area -->
  <g transform="translate(95,520)">
    <circle cx="16" cy="14" r="14" fill="rgba(196,160,82,0.15)" stroke="#C4A052" stroke-width="0.5"/>
    <text x="16" y="18" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#C4A052" font-weight="bold">JW</text>
    <text x="42" y="10" font-family="Helvetica,sans-serif" font-size="11" fill="#fff">James Wellington</text>
    <text x="42" y="24" font-family="Helvetica,sans-serif" font-size="9" fill="#C4A052">Gold Elite Member</text>
  </g>
  <!-- Main content area -->
  <!-- Top cards row -->
  <g transform="translate(300,195)">
    <!-- Total Balance -->
    <rect width="240" height="90" rx="8" fill="rgba(196,160,82,0.04)" stroke="rgba(196,160,82,0.12)" stroke-width="1"/>
    <text x="18" y="28" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">Total Balance</text>
    <text x="18" y="55" font-family="Helvetica,sans-serif" font-size="24" fill="#fff" font-weight="bold">$4,847,392</text>
    <text x="18" y="76" font-family="Helvetica,sans-serif" font-size="11" fill="#10B981">↑ 18.7% this year</text>
  </g>
  <g transform="translate(555,195)">
    <!-- Today's P&L -->
    <rect width="240" height="90" rx="8" fill="rgba(16,185,129,0.04)" stroke="rgba(16,185,129,0.12)" stroke-width="1"/>
    <text x="18" y="28" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">Today's P&amp;L</text>
    <text x="18" y="55" font-family="Helvetica,sans-serif" font-size="24" fill="#10B981" font-weight="bold">+$12,847</text>
    <text x="18" y="76" font-family="Helvetica,sans-serif" font-size="11" fill="#10B981">↑ 0.27% today</text>
  </g>
  <g transform="translate(810,195)">
    <!-- Dividend Income -->
    <rect width="240" height="90" rx="8" fill="rgba(196,160,82,0.04)" stroke="rgba(196,160,82,0.12)" stroke-width="1"/>
    <text x="18" y="28" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">Monthly Dividends</text>
    <text x="18" y="55" font-family="Helvetica,sans-serif" font-size="24" fill="#C4A052" font-weight="bold">$8,426</text>
    <text x="18" y="76" font-family="Helvetica,sans-serif" font-size="11" fill="#6B7280">Next payout: Mar 15</text>
  </g>
  <!-- Chart area -->
  <g transform="translate(300,300)">
    <rect width="500" height="240" rx="8" fill="rgba(196,160,82,0.02)" stroke="rgba(196,160,82,0.08)" stroke-width="1"/>
    <text x="18" y="28" font-family="Helvetica,sans-serif" font-size="13" fill="#fff" font-weight="bold">Portfolio Performance</text>
    <!-- Mini tabs -->
    <g font-family="Helvetica,sans-serif" font-size="10">
      <text x="350" y="28" fill="#6B7280">1D</text>
      <text x="380" y="28" fill="#6B7280">1W</text>
      <text x="410" y="28" fill="#C4A052" font-weight="bold">1M</text>
      <text x="440" y="28" fill="#6B7280">1Y</text>
      <text x="465" y="28" fill="#6B7280">ALL</text>
    </g>
    <!-- Chart line -->
    <polyline fill="none" stroke="#10B981" stroke-width="2" stroke-linejoin="round"
      points="30,180 60,170 90,165 120,175 150,150 180,140 210,145 240,120 270,115 300,130 330,105 360,95 390,90 420,80 450,70 475,60"/>
    <!-- Chart fill -->
    <polygon fill="#10B981" opacity="0.05"
      points="30,180 60,170 90,165 120,175 150,150 180,140 210,145 240,120 270,115 300,130 330,105 360,95 390,90 420,80 450,70 475,60 475,220 30,220"/>

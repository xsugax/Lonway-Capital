name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Build User App ──
      - name: Install user dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/user
      - name: Build user app
        run: npm run build
        working-directory: apps/user
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.londwaycapital.com' }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_OTP: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_OTP }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_WELCOME: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_WELCOME }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # ── Build Admin App ──
      - name: Install admin dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
        working-directory: apps/admin
      - name: Build admin app
        run: npm run build
        working-directory: apps/admin
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.londwaycapital.com' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # ── Merge outputs ──
      - name: Merge user + admin into single site
        run: |
          cp -r apps/admin/out apps/user/out/admin
      - name: Add .nojekyll
        run: touch apps/user/out/.nojekyll
      - name: Add CNAME
        run: echo "londwaycapital.com" > apps/user/out/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/user/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

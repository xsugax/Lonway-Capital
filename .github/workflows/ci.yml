name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-user:
    name: Build User App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.londwaycapital.com
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_OTP: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_OTP }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_WELCOME: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_WELCOME }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  build-admin:
    name: Build Admin App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.londwaycapital.com
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_WELCOME: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_WELCOME }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

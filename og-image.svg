<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0D1628"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4A052"/>
      <stop offset="100%" stop-color="#a8873e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#C4A052" stroke-width="1" opacity="0.3"/>
  <!-- Lock icon -->
  <g transform="translate(540, 120)">
    <circle cx="60" cy="60" r="48" stroke="#C4A052" stroke-width="3" fill="none"/>
    <path d="M40,80 V55 C40,30 80,30 80,55 V80" stroke="#C4A052" stroke-width="5" fill="none"/>
    <line x1="25" y1="80" x2="95" y2="80" stroke="#C4A052" stroke-width="2"/>
  </g>
  <!-- Title -->
  <text x="600" y="290" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-1">Londway Capital</text>
  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#C4A052" letter-spacing="4" text-transform="uppercase">PREMIUM PRIVATE BANKING</text>
  <!-- Description -->
  <text x="600" y="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#9ca3af">Secure wealth management, investments, and digital banking</text>
  <!-- Features -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b7280">
    <text x="280" y="470" text-anchor="middle">🏦 Banking</text>
    <text x="440" y="470" text-anchor="middle">💳 Cards</text>
    <text x="600" y="470" text-anchor="middle">📊 Investments</text>
    <text x="760" y="470" text-anchor="middle">🔐 Vaults</text>
    <text x="920" y="470" text-anchor="middle">₿ Crypto</text>
  </g>
  <!-- Rating -->
  <g transform="translate(480, 510)">
    <text font-family="Inter, system-ui, sans-serif" font-size="16" fill="#C4A052" font-weight="700">★★★★★</text>
    <text x="90" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#9ca3af">4.8/5 from 250+ reviews</text>
  </g>
  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#C4A052" font-weight="600" letter-spacing="2">londwaycapital.com</text>
</svg>
